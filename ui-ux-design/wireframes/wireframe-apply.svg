<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t">
<title id="t">Wireframe — Apply flow, 3 steps (low fidelity)</title>
<style>
  text{font-family:Inter,system-ui,sans-serif;fill:#444}
  .b{fill:#fff;stroke:#999;stroke-width:1.5}
  .g{fill:#e8e8e8;stroke:#999;stroke-width:1.5}
  .t{font-size:13px;font-weight:700}.s{font-size:11px;fill:#777}.cap{font-size:18px;font-weight:800;fill:#222}
  .line{stroke:#bbb;stroke-width:1.5}
</style>
<text x="20" y="30" class="cap">WF-03 · Apply — 3 steps, one job per step (low-fi)</text>
<text x="20" y="56" class="s">← Back to bounty · Step 1 of 3 · $1,500 USDC · Deadline 12 Nov 2026</text>
<!-- step indicator -->
<rect x="20" y="72" width="300" height="8" class="g"/><rect x="330" y="72" width="300" height="8" class="b"/><rect x="640" y="72" width="300" height="8" class="b"/>
<text x="20" y="100" class="t">1 · Your profile (current)</text><text x="330" y="100" class="s">2 · Your approach</text><text x="640" y="100" class="s">3 · Review &amp; submit</text>
<!-- step 1 -->
<rect x="20" y="120" width="440" height="300" class="b"/>
<text x="36" y="148" class="t">Step 1 — Your profile</text>
<text x="36" y="180" class="s">Full name</text><rect x="36" y="188" width="408" height="34" class="b"/>
<text x="36" y="250" class="s">Portfolio or profile link</text><rect x="36" y="258" width="408" height="34" class="b"/>
<text x="36" y="310" class="s">Hint: must start with https://</text>
<text x="36" y="342" class="s">Solana wallet address (for payout)</text><rect x="36" y="350" width="408" height="34" class="b"/>
<text x="36" y="402" class="s">⚠ Payouts can’t be reversed — double-check it.</text>
<!-- step 2 -->
<rect x="500" y="120" width="440" height="300" class="b"/>
<text x="516" y="148" class="t">Step 2 — Your approach</text>
<text x="516" y="180" class="s">Your approach (3–5 sentences)</text><rect x="516" y="188" width="408" height="90" class="b"/>
<text x="516" y="292" class="s">0 / 1200 characters — live counter</text>
<text x="516" y="322" class="s">Time you can commit this week</text><rect x="516" y="330" width="408" height="34" class="b"/>
<text x="516" y="392" class="s">Submission file (optional for now)</text>
<!-- step 3 -->
<rect x="20" y="440" width="600" height="140" class="b"/>
<text x="36" y="468" class="t">Step 3 — Review &amp; submit</text>
<text x="36" y="492" class="s">Name ———— value · Portfolio ———— value · Wallet ———— value</text>
<text x="36" y="514" class="s">Approach ———— first 140 chars…</text>
<text x="36" y="548" class="s">☐ I confirm this is my own original work and I’ve read the judging criteria.</text>
<rect x="640" y="440" width="300" height="140" class="b"/>
<text x="656" y="468" class="t">Success state</text>
<text x="656" y="492" class="s">🎉 Application submitted</text>
<text x="656" y="514" class="s">Reference ST-2481-0042</text>
<text x="656" y="536" class="s">Edit until 12 Nov · Winners 17 Nov</text>
<text x="656" y="560" class="s">[ Browse more bounties ]</text>
<text x="20" y="620" class="s">Annotations: validation is inline per step (error text under the field, aria-invalid). Submit is never disabled — it explains. Focus moves to the first field of each new step.</text>
</svg>
