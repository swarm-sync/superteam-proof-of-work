<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="Solforge color palette">
<title>Solforge color palette</title>
<defs><linearGradient id="forge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#4C1D95"/></linearGradient></defs><rect x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
