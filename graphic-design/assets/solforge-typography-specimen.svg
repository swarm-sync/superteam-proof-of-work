<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Solforge typography specimen">
<title>Solforge typography specimen</title>
<defs><linearGradient id="forge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#4C1D95"/></linearGradient></defs><rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>
<text x="60" y="90" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="48" fill="#16132B">Solforge — Typography</text>
<text x="60" y="220" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="110" fill="#6D28D9">Aa</text>
<text x="220" y="180" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="36" fill="#16132B">Space Grotesk Bold — Display</text>
<text x="220" y="230" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="44" fill="#16132B">Ship at the speed of thought</text>
<text x="60" y="380" font-family="'Inter', sans-serif" font-size="96" fill="#16132B">Aa</text>
<text x="220" y="340" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="36" fill="#16132B">Inter — Body</text>
<text x="220" y="390" font-family="'Inter', sans-serif" font-size="26" fill="#3A3654">Solforge compiles, tests and deploys Solana programs from one CLI.</text>
<text x="60" y="530" font-family="'JetBrains Mono', monospace" font-size="80" fill="#00D9A6">Aa</text>
<text x="220" y="500" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="36" fill="#16132B">JetBrains Mono — Code &amp; labels</text>
<text x="220" y="550" font-family="'JetBrains Mono', monospace" font-size="28" fill="#16132B">$ solforge test --watch</text>
<rect x="60" y="620" width="1080" height="1" fill="#8A8FA3"/>
<text x="60" y="680" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8A8FA3">SCALE — Display 64/700 · H1 48/700 · H2 36/700 · Body 18/400 · Caption 14/600 · Code 16/500</text>
<text x="60" y="720" font-family="'JetBrains Mono', monospace" font-size="22" fill="#8A8FA3">LINE HEIGHT — Display 1.05 · Headings 1.15 · Body 1.6 · Code 1.5</text>
<text x="60" y="790" font-family="'Inter', sans-serif" font-size="22" fill="#8A8FA3">Display never set below 32px. Body never set in Space Grotesk. Code never set in Inter.</text>
</svg>
