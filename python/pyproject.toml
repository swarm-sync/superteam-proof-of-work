[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bounty-api"
version = "0.1.0"
description = "Production-grade FastAPI service for bounty listings: validated CRUD, filtering, pagination, and sorting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Benjamin Stone" }]
keywords = ["fastapi", "api", "bounties", "pydantic", "solana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
bounty-api = "bounty_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bounty_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["bounty_api"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends() in parameter defaults is the framework idiom.
ignore = ["B008"]
